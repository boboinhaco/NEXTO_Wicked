# Render 배포 설정 (심사기간 공개 URL)
services:
  - type: web
    name: nexto-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: DEMO_MODE
        value: "true"
